<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="770" viewBox="0 0 1600 770" role="img"><title>What travels inside your USD asset?</title><rect width="1600" height="770" fill="#08090c"/>
<text x="55" y="75" fill="#f8f8fb" font-family="Geist" font-size="46" font-weight="500">What travels inside your USD asset?</text>
<text x="55" y="120" fill="#b1b7c1" font-family="Geist" font-size="26" font-weight="500">One portable asset package, with surface, scale, physics and searchable descriptions.</text>
<rect x="55" y="170" width="1490" height="70" rx="18" fill="#21162f" stroke="#785096"/>
<text x="85" y="216" fill="#cdb2ff" font-family="Geist" font-size="32" font-weight="500">USD / USDZ</text>
<text x="420" y="216" fill="#f8f8fb" font-family="Geist" font-size="30" font-weight="500">Geometry + PBR materials + structured asset data</text>
<text x="85" y="298" fill="#b1b7c1" font-family="Geist Mono" font-size="22" font-weight="500">STORED WITH THE ASSET</text>
<text x="880" y="298" fill="#b1b7c1" font-family="Geist Mono" font-size="22" font-weight="500">WHAT YOU CAN DO WITH IT</text>
<rect x="55" y="325" width="1490" height="68" rx="10" fill="#111318" stroke="#30343b"/>
<text x="85" y="368" fill="#f8f8fb" font-family="Geist" font-size="27" font-weight="500">Geometry + colour, roughness, metallic, IOR</text>
<path d="M800,358 L845,358 m-12,-8 l12,8 l-12,8" stroke="#cdb2ff" stroke-width="3" fill="none"/>
<text x="880" y="368" fill="#cdb2ff" font-family="Geist" font-size="26" font-weight="500">Render the same finish in another scene</text>
<rect x="55" y="407" width="1490" height="68" rx="10" fill="#111318" stroke="#30343b"/>
<text x="85" y="450" fill="#f8f8fb" font-family="Geist" font-size="27" font-weight="500">Real dimensions + units + orientation</text>
<path d="M800,440 L845,440 m-12,-8 l12,8 l-12,8" stroke="#cdb2ff" stroke-width="3" fill="none"/>
<text x="880" y="450" fill="#cdb2ff" font-family="Geist" font-size="26" font-weight="500">Place it at the right size</text>
<rect x="55" y="489" width="1490" height="68" rx="10" fill="#111318" stroke="#30343b"/>
<text x="85" y="532" fill="#f8f8fb" font-family="Geist" font-size="27" font-weight="500">Colliders + mass + friction + bounce</text>
<path d="M800,522 L845,522 m-12,-8 l12,8 l-12,8" stroke="#cdb2ff" stroke-width="3" fill="none"/>
<text x="880" y="532" fill="#cdb2ff" font-family="Geist" font-size="26" font-weight="500">Drop, slide and collide in simulation</text>
<rect x="55" y="571" width="1490" height="68" rx="10" fill="#111318" stroke="#30343b"/>
<text x="85" y="614" fill="#f8f8fb" font-family="Geist" font-size="27" font-weight="500">Category + materials + condition + tags</text>
<path d="M800,604 L845,604 m-12,-8 l12,8 l-12,8" stroke="#cdb2ff" stroke-width="3" fill="none"/>
<text x="880" y="614" fill="#cdb2ff" font-family="Geist" font-size="26" font-weight="500">Find it; choose sounds and surface effects</text>
<text x="65" y="706" fill="#b1b7c1" font-family="Geist" font-size="24" font-weight="500">Predicted properties need review. Your application connects metadata to sounds and interactions.</text>
<text x="55" y="744" fill="#b1b7c1" font-family="Geist Mono" font-size="18" font-weight="500">MARSO WORKFLOW GUIDE</text>
<text x="1380" y="744" fill="#f8f8fb" font-family="Geist" font-size="24" font-weight="500">marso.app</text>
</svg>